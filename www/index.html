
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HINDU ZONE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#160d24;
 color:white;
 text-align:center;
}
header{
 background:linear-gradient(135deg,#ff6a00,#b90048);
 padding:30px 15px;
}
.logo{font-size:45px}
h1{margin:8px;font-size:30px}
header p{margin:5px}
.container{padding:20px}
.card{
 background:#2b1b3d;
 padding:20px;
 margin:14px 0;
 border-radius:15px;
 border:1px solid #754a91;
}
.card h2{color:#ffbd42}
button{
 background:#ff8c00;
 color:white;
 border:0;
 padding:12px 22px;
 border-radius:25px;
 font-size:16px;
}
footer{padding:20px;color:#bbb}
</style>
</head>
<body>
<header>
<div class="logo">🕉️</div>
<h1>HINDU ZONE</h1>
<p>সনাতন ধর্মের জ্ঞান ও ভক্তির জগৎ</p>
</header>

<div class="container">
<div class="card">
<h2>🙏 ঈশ্বর বন্দনা</h2>
<p>ভগবানের নাম স্মরণ করুন।</p>
<button onclick="alert('শীঘ্রই আসছে')">দেখুন</button>
</div>

<div class="card">
<h2>📖 ধর্মীয় কাহিনী</h2>
<p>হিন্দু ধর্মের বিভিন্ন কাহিনী পড়ুন।</p>
<button onclick="alert('শীঘ্রই আসছে')">পড়ুন</button>
</div>

<div class="card">
<h2>🎵 ভক্তিমূলক গান</h2>
<p>ভক্তিমূলক গানের সংগ্রহ।</p>
<button onclick="alert('শীঘ্রই আসছে')">শুনুন</button>
</div>

<div class="card">
<h2>🛕 পূজা ও উৎসব</h2>
<p>পূজা-পার্বণের তথ্য জানুন।</p>
<button onclick="alert('শীঘ্রই আসছে')">দেখুন</button>
</div>
</div>

<footer>
© 2026 HINDU ZONE | জয় শ্রী রাম 🕉️
</footer>

</html>
