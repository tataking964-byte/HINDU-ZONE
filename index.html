<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>HINDU ZONE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 12px;background:linear-gradient(140deg,#350000,#a00000,#350000);border-bottom:3px solid #d5a52b}
.logo{font-size:48px}
h1,h2,h3{color:#ffd700}
.container{width:94%;max-width:650px;margin:22px auto}
.panel{background:#1b1717;border:1px solid #a98639;border-radius:16px;padding:18px;margin-bottom:20px}
input{width:100%;padding:14px;margin:9px 0;background:#090909;color:white;border:1px solid #9b7935;border-radius:10px}
button{width:100%;padding:14px;margin:7px 0;background:linear-gradient(100deg,#720000,#250909);color:white;border:1px solid #b28c40;border-radius:12px;font-weight:bold;font-size:16px}
.gold{background:linear-gradient(100deg,#d5a000,#845f00);color:black}
.hidden{display:none!important}
.lesson-btn{text-align:left;font-size:18px}
#lesson{background:#100b07;border:1px solid #8c692e;padding:18px;border-radius:12px;margin-top:20px;min-height:100px;white-space:pre-wrap}
#recaptcha-container{margin:10px 0}
small{color:#ddd}
</style>
</head>
<body>

<header>
<div class="logo">🕉️</div>
<h1>HINDU ZONE</h1>
<p>🙏 আমাদের ধর্ম, আমাদের গর্ব 🙏</p>
</header>

<main class="container">

<section id="login-section" class="panel">
<h2>🔐 HINDU ZONE LOGIN</h2>

<h3>Gmail Registration / Login</h3>
<input id="email" type="email" placeholder="তোমার Gmail">
<input id="password" type="password" placeholder="Password">

<button class="gold" id="registerBtn">নতুন Registration</button>
<button id="loginBtn">Login</button>

<hr style="border-color:#705326;margin:22px 0">

<h3>📱 Mobile OTP Login</h3>
<input id="phone" type="tel" placeholder="+8801XXXXXXXXX">
<div id="recaptcha-container"></div>
<button id="sendOtpBtn">OTP পাঠাও</button>
<input id="otp" type="text" placeholder="৬ সংখ্যার OTP">
<button id="verifyOtpBtn">OTP Verify ও Login</button>

<p id="auth-message"></p>
</section>

<section id="user-area" class="panel hidden">
<h2>🙏 স্বাগতম HINDU ZONE-এ</h2>
<p id="user-email"></p>
<button id="logoutBtn">Logout</button>
</section>

<section id="education" class="panel hidden">
<h2 style="text-align:center">🕉️ HINDU ZONE EDUCATION</h2>
<h3 style="text-align:center">ধর্মীয় শিক্ষা</h3>

<button class="lesson-btn" data-lesson="গীতা">📖 শ্রীমদ্ভগবদ্গীতা</button>
<button class="lesson-btn" data-lesson="মন্ত্র">🙏 পূজা ও মন্ত্র</button>
<button class="lesson-btn" data-lesson="পুরাণ">📚 পুরাণ ও ইতিহাস</button>
<button class="lesson-btn" data-lesson="ধর্ম">🕉️ হিন্দু ধর্মের জ্ঞান</button>
<button class="lesson-btn" data-lesson="কুইজ">❓ ধর্মীয় কুইজ</button>

<div id="lesson">উপরের একটি শিক্ষা নির্বাচন করো।</div>
</section>

<section id="adminPanel" class="panel hidden">
<h2>👑 ADMIN PANEL</h2>
<p>Firebase Server থেকে Admin অনুমতি যাচাই হয়েছে।</p>
</section>

</main>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
 getAuth, createUserWithEmailAndPassword,
 signInWithEmailAndPassword, signOut,
 onAuthStateChanged, RecaptchaVerifier,
 signInWithPhoneNumber, getIdTokenResult
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyA1YcQY2YdXoB6XVSkSgSM4hMr56DpLbXY",
 authDomain: "hindu-zone.firebaseapp.com",
 projectId: "hindu-zone",
 storageBucket: "hindu-zone.firebasestorage.app",
 messagingSenderId: "952903513012",
 appId: "1:952903513012:web:2ec4bc303c00280063b8e1",
 measurementId: "G-GJKCNFJ2MK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
let confirmationResult = null;
let recaptchaVerifier = null;

function message(text){
 $("auth-message").textContent = text;
}

$("registerBtn").onclick = async () => {
 try{
  const email = $("email").value.trim();
  const password = $("password").value;
  if(!email || password.length < 6)
   throw new Error("সঠিক Gmail ও কমপক্ষে ৬ অক্ষরের Password দাও।");
  await createUserWithEmailAndPassword(auth,email,password);
  message("Registration সফল হয়েছে!");
 }catch(e){message(e.message);}
};

$("loginBtn").onclick = async () => {
 try{
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
  message("Login সফল!");
 }catch(e){message(e.message);}
};

$("sendOtpBtn").onclick = async () => {
 try{
  const phone = $("phone").value.trim();
  if(!phone.startsWith("+"))
   throw new Error("দেশের কোডসহ নম্বর দাও, যেমন +8801XXXXXXXXX");

  if(!recaptchaVerifier){
   recaptchaVerifier = new RecaptchaVerifier(
    auth,"recaptcha-container",{}
   );
  }
  confirmationResult = await signInWithPhoneNumber(
   auth,phone,recaptchaVerifier
  );
  message("OTP পাঠানো হয়েছে।");
 }catch(e){
  message(e.message);
  if(recaptchaVerifier){
   recaptchaVerifier.clear();
   recaptchaVerifier = null;
  }
 }
};

$("verifyOtpBtn").onclick = async () => {
 try{
  if(!confirmationResult)
   throw new Error("আগে OTP পাঠাও।");
  await confirmationResult.confirm($("otp").value.trim());
  message("OTP সফলভাবে Verify হয়েছে!");
 }catch(e){message("OTP ভুল অথবা মেয়াদ শেষ: "+e.message);}
};

$("logoutBtn").onclick = async () => {
 await signOut(auth);
 message("Logout হয়েছে।");
};

onAuthStateChanged(auth, async user => {
 $("login-section").classList.toggle("hidden",!!user);
 $("user-area").classList.toggle("hidden",!user);
 $("education").classList.toggle("hidden",!user);
 $("adminPanel").classList.add("hidden");

 if(user){
  $("user-email").textContent = user.email || user.phoneNumber || "সদস্য";
  try{
   const token = await getIdTokenResult(user,true);
   if(token.claims.admin === true){
    $("adminPanel").classList.remove("hidden");
   }
  }catch(e){
   console.error("Admin verification failed",e);
  }
 }
});

const lessons = {
 "গীতা":"শ্রীমদ্ভগবদ্গীতা\n\nগীতা হলো শ্রীকৃষ্ণের দেওয়া জীবন ও কর্মের শিক্ষা।\n\nঅধ্যায় ২: নিজের কর্তব্য পালন করো এবং ফলের প্রতি আসক্ত হয়ো না।",
 "মন্ত্র":"পূজা ও মন্ত্র\n\nওঁ নমো ভগবতে বাসুদেবায়।\n\nওঁ নমঃ শিবায়।\n\nশ্রদ্ধা ও ভক্তির সঙ্গে প্রার্থনা করো।",
 "পুরাণ":"পুরাণ ও ইতিহাস\n\nহিন্দু ধর্মে রামায়ণ, মহাভারত ও বিভিন্ন পুরাণের গুরুত্বপূর্ণ শিক্ষা রয়েছে।",
 "ধর্ম":"হিন্দু ধর্মের জ্ঞান\n\nসত্য, অহিংসা, দয়া, সেবা ও কর্তব্য পালন ধর্মীয় জীবনের গুরুত্বপূর্ণ শিক্ষা।",
 "কুইজ":"ধর্মীয় কুইজ\n\nপ্রশ্ন: শ্রীমদ্ভগবদ্গীতায় কারা উপদেশ দিয়েছেন?\n\nউত্তর: শ্রীকৃষ্ণ।"
};

document.addEventListener("click",event=>{
 const button = event.target.closest(".lesson-btn");
 if(!button)return;
 $("lesson").textContent = lessons[button.dataset.lesson] || "শিক্ষা পাওয়া যায়নি।";
});
</script>
</body>
</html>
