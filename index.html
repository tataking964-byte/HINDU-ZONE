<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HINDU ZONE</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}
header{background:#260000;padding:25px;color:gold}
h1{color:gold}
.card{background:#222;margin:15px;padding:20px;border-radius:15px}
input{padding:12px;margin:8px;width:85%;border-radius:8px}
button{background:#b00000;color:white;border:0;padding:12px 20px;margin:6px;border-radius:20px}
#education{display:none}
</style>
</head>
<body>

<header>
<h1>🕉️ HINDU ZONE</h1>
<p>সনাতন ধর্মের জ্ঞান ও ভক্তির জগৎ</p>
</header>

<section class="card" id="login-section">
<h2>🔐 Login / Registration</h2>
<input id="email" type="email" placeholder="Gmail">
<input id="password" type="password" placeholder="Password">
<br>
<button onclick="registerUser()">Create Account</button>
<button onclick="loginUser()">Login</button>
<p id="message"></p>
</section>

<section id="education" class="card">
<h2>🕉️ HINDU ZONE EDUCATION</h2>
<h3>ধর্মীয় শিক্ষা</h3>
<button onclick="showLesson('শ্রীমদ্ভগবদ্গীতা')">📖 গীতা</button>
<button onclick="showLesson('পূজা ও মন্ত্র')">🙏 পূজা ও মন্ত্র</button>
<button onclick="showLesson('পুরাণ ও ইতিহাস')">📜 পুরাণ</button>
<button onclick="showLesson('হিন্দু ধর্মের জ্ঞান')">🕉️ ধর্মীয় জ্ঞান</button>
<button onclick="showLesson('ধর্মীয় কুইজ')">❓ কুইজ</button>
<div id="lesson"></div>
<button onclick="logoutUser()">Logout</button>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyA1YcQY2YdXoB6XVSkSgSM4hMr56DpLbXY",
authDomain: "hindu-zone.firebaseapp.com",
projectId: "hindu-zone",
storageBucket: "hindu-zone.firebasestorage.app",
messagingSenderId: "952903513012",
appId: "1:952903513012:web:2ec4bc303c00280063b8e1",
measurementId: "G-GJKCNFJ2MK"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

window.registerUser=async()=>{
try{
await createUserWithEmailAndPassword(auth,email.value,password.value);
message.textContent="Registration successful!";
}catch(e){message.textContent=e.message;}
};

window.loginUser=async()=>{
try{
await signInWithEmailAndPassword(auth,email.value,password.value);
message.textContent="Login successful!";
}catch(e){message.textContent=e.message;}
};

window.logoutUser=async()=>{
await signOut(auth);
};

onAuthStateChanged(auth,user=>{
document.getElementById("login-section").style.display=user?"none":"block";
document.getElementById("education").style.display=user?"block":"none";
});

window.showLesson=(name)=>{
document.getElementById("lesson").textContent=name+" - শীঘ্রই পাঠ যোগ করা হবে।";
};
</script>
</body>
</html>
